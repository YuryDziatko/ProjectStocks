<!DOCTYPE html>
<html>
<head>
    <title>Stock Prediction App</title>
</head>
<body>
    <h1>Stock Prediction</h1>
    <form id="predict-form">
        <label for="ticker">Choose a stock:</label>
        <select name="ticker" id="ticker">
            {% for ticker in tickers %}
                <option value="{{ ticker }}">{{ ticker }}</option>
            {% endfor %}
        </select>
        <button type="submit">Predict</button>
    </form>

    <h2 id="result-title" style="display:none;">Prediction Result:</h2>
    <pre id="result-output">Waiting for prediction...</pre>

    <script>
        document.getElementById("predict-form").addEventListener("submit", async function(event) {
            event.preventDefault(); // prevent full page reload

            const formData = new FormData(this);
            const response = await fetch("/api/predict", {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            const output = document.getElementById("result-output");
            const title = document.getElementById("result-title");

            if (data.success) {
                title.style.display = "block";
                output.textContent = JSON.stringify(data.result, null, 2);
            } else {
                title.style.display = "block";
                output.textContent = "Error: " + data.error;
            }
        });
    </script>
</body>
</html>
