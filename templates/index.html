<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Prediction App</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 1rem;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f0f4f8;
        }

        h1, h2 {
            text-align: center;
            font-size: 6vw;
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 400px;
            width: 100%;
            margin: auto;
        }

        select, button {
            padding: 1rem;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result-output {
            white-space: pre-wrap;
            padding: 1rem;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 1rem;
            max-width: 600px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <h1>Stock Prediction</h1>

    <form id="predict-form">
        <label for="ticker">Choose a stock:</label>
        <select name="ticker" id="ticker">
            {% for ticker in tickers %}
                <option value="{{ ticker }}">{{ ticker }}</option>
            {% endfor %}
        </select>
        <button type="submit">Predict</button>
    </form>

    <h2 id="result-title" style="display:none;">Prediction Result:</h2>
    <pre id="result-output"></pre>

<script>
document.getElementById("predict-form").addEventListener("submit", async function(event) {
    event.preventDefault(); // prevent page reload

    const title = document.getElementById("result-title");
    const output = document.getElementById("result-output");

    // Show loader message while processing
    title.style.display = "block";
    output.textContent = "Prediction in progress... ⏳";

    const formData = new FormData(this);
    try {
        const response = await fetch("/api/predict", {
            method: "POST",
            body: formData
        });

        const data = await response.json();
        output.textContent = data.message;

    } catch (error) {
        output.textContent = "Error during prediction 😞";
        console.error(error);
    }
});
</script>
</body>
</html>
